<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#245edb" />
  <title>Alper Can Karakaş · Game Developer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="wallpaper.jpg" as="image">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      --ui: Tahoma, 'Segoe UI', Verdana, sans-serif;
      --title: 'Trebuchet MS', Tahoma, sans-serif;
      --taskbar-h: 36px;
      --xp-beige: #ece9d8;
      --xp-link: #215dc6;
      --xp-link-hover: #428eff;
      --xp-select: #316ac5;
      --ink: #1b1b1b;
      --ink-soft: #555;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      background: #000;
      font-family: var(--ui);
      font-size: 14px;
      color: var(--ink);
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 1px dotted #000;
      outline-offset: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .ico {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ---------- screen / CRT ---------- */

    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background: #3a7bd5 url(wallpaper.jpg) center 30% / cover no-repeat;
    }

    .screen.booting {
      animation: crt-on .9s cubic-bezier(.2, .7, .3, 1) both;
    }

    .screen.shutting {
      animation: crt-off .55s cubic-bezier(.75, .05, .85, .06) forwards;
    }

    @keyframes crt-on {
      0% {
        transform: scale(1, .004);
        filter: brightness(5);
      }

      30% {
        transform: scale(1, .004);
        filter: brightness(4);
      }

      70% {
        transform: scale(1, 1);
        filter: brightness(1.4);
      }

      100% {
        transform: none;
        filter: none;
      }
    }

    @keyframes crt-off {
      0% {
        transform: scale(1, 1);
        filter: brightness(1);
      }

      60% {
        transform: scale(1.2, .004);
        filter: brightness(3);
      }

      100% {
        transform: scale(0, .002);
        filter: brightness(4);
      }
    }

    .crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200000;
      background:
        repeating-linear-gradient(rgba(0, 0, 0, .045) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, .28) 100%);
    }

    .power {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #101820 0, #000 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .power-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #d8e4f8;
      font-family: var(--title);
      font-size: 15px;
    }

    .power-btn .pw {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      padding: 18px;
      background: linear-gradient(#f5a27a, #e0552a 45%, #c63c13 55%, #e26a3c);
      border: 2px solid #fff;
      box-shadow: 0 0 24px rgba(255, 120, 60, .45);
      transition: box-shadow .2s, transform .2s;
    }

    .power-btn:hover .pw {
      box-shadow: 0 0 40px rgba(255, 140, 80, .8);
      transform: scale(1.04);
    }

    /* ---------- boot screen ---------- */

    .boot {
      position: absolute;
      inset: 0;
      z-index: 150000;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11vh;
      padding: 16px;
      cursor: default;
      transition: opacity .4s;
    }

    .boot.fade {
      opacity: 0;
    }

    .boot-logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .boot-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: -2px;
    }

    .boot-name {
      font: 700 clamp(14px, 2.6vw, 21px) Arial, Helvetica, sans-serif;
      letter-spacing: .02em;
      padding-bottom: 6px;
    }

    .boot-flag {
      width: clamp(64px, 11vw, 104px);
      height: auto;
      aspect-ratio: 100 / 92;
    }

    .boot-big {
      font: 700 clamp(52px, 11vw, 100px) / .95 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      letter-spacing: -.02em;
    }

    .boot-big sup {
      font-size: .42em;
      color: #f26b21;
      margin-left: .08em;
      vertical-align: .9em;
      letter-spacing: 0;
    }

    .boot-sub {
      font: italic 700 clamp(15px, 2.6vw, 22px) Arial, Helvetica, sans-serif;
      margin: 4px 0 0 .3em;
    }

    .boot-bar {
      position: relative;
      width: 160px;
      height: 20px;
      border: 2px solid #b2b2b2;
      border-radius: 6px;
      overflow: hidden;
    }

    .boot-bar span {
      position: absolute;
      top: 3px;
      left: -42px;
      display: flex;
      gap: 2px;
      width: 36px;
      height: 10px;
      animation: bootbar 1.5s linear infinite;
    }

    .boot-bar i {
      flex: 1;
      border-radius: 1px;
      background: linear-gradient(#c2d4ff 0%, #4a75f0 35%, #1d40c5 70%, #5a86f5 100%);
    }

    @keyframes bootbar {
      to {
        left: 166px;
      }
    }

    .boot-foot {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      font: 12px Arial, sans-serif;
      color: #9a9a9a;
    }

    /* ---------- desktop icons + marquee ---------- */

    .desktop-icons {
      position: absolute;
      top: 10px;
      left: 8px;
      bottom: calc(var(--taskbar-h) + 10px);
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px 6px;
      list-style: none;
      z-index: 1;
    }

    .d-icon {
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 12.5px;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
    }

    .d-icon .glyph {
      width: 48px;
      height: 48px;
      filter: drop-shadow(1px 2px 1.5px rgba(0, 0, 0, .45));
    }

    .d-icon .lbl {
      padding: 1px 3px;
      text-shadow: 1px 1px 1px #000, 0 0 3px rgba(0, 0, 0, .6);
    }

    .d-icon:focus-visible {
      outline: none;
    }

    .d-icon:focus-visible .lbl {
      outline: 1px dotted #fff;
    }

    .d-icon.sel .lbl {
      background: var(--xp-select);
      text-shadow: none;
    }

    .d-icon.sel .glyph {
      filter: drop-shadow(1px 2px 1.5px rgba(0, 0, 0, .45)) sepia(.7) hue-rotate(180deg) saturate(2.2) brightness(.8);
    }

    .marquee {
      position: absolute;
      z-index: 2;
      border: 1px solid var(--xp-select);
      background: rgba(49, 106, 197, .28);
      pointer-events: none;
    }

    /* ---------- windows (Luna) ---------- */

    #windows {
      position: absolute;
      inset: 0 0 var(--taskbar-h) 0;
      pointer-events: none;
      z-index: 5;
    }

    .win {
      position: absolute;
      display: flex;
      flex-direction: column;
      padding: 0 3px 3px;
      border-radius: 8px 8px 0 0;
      pointer-events: auto;
      touch-action: auto;
      background: #0831d9;
      box-shadow:
        inset -1px -1px #00138c, inset 1px 1px #0831d9,
        inset -2px -2px #001ea0, inset 2px 2px #166aee,
        inset -3px -3px #003bda, inset 3px 3px #0855dd,
        4px 6px 18px rgba(0, 0, 0, .4);
      outline: none;
    }

    .win:not(.active) {
      background: #7a96df;
      box-shadow:
        inset -1px -1px #6f88d0, inset 1px 1px #7a96df,
        inset -2px -2px #7b93d8, inset 2px 2px #96afe9,
        inset -3px -3px #8aa3e3, inset 3px 3px #8ea9e8,
        2px 4px 12px rgba(0, 0, 0, .25);
    }

    .win.opening {
      animation: win-in .18s ease-out;
    }

    @keyframes win-in {
      from {
        opacity: 0;
        transform: scale(.96);
      }
    }

    .win.max {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0;
    }

    .win-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      margin: 0 -3px;
      padding: 0 5px 0 7px;
      flex-shrink: 0;
      border-radius: 7px 7px 0 0;
      background: linear-gradient(#0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #06f 93%, #005bff 95%, #003dd7 96%, #003dd7 100%);
      user-select: none;
      touch-action: none;
      cursor: default;
    }

    .win.max .win-bar {
      border-radius: 0;
    }

    .win:not(.active) .win-bar {
      background: linear-gradient(#94aee9 0%, #7b9ae5 8%, #7a99e4 40%, #86a3eb 88%, #86a3eb 93%, #8aa6ec 95%, #7590de 96%, #7590de 100%);
    }

    .win-ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .win-title {
      flex: 1;
      min-width: 0;
      font-family: var(--title);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 1px 1px #0f1089;
    }

    .win:not(.active) .win-title {
      color: #d8e4f8;
      text-shadow: none;
    }

    .win-ctrls {
      display: flex;
      gap: 2px;
    }

    .wc {
      width: 21px;
      height: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fff;
      border-radius: 3px;
      background: radial-gradient(circle at 90% 90%, #0054e9 0%, #2263d5 55%, #4479e4 70%, #a3bbec 90%, #fff 100%);
      box-shadow: inset 0 -1px 2px 1px rgba(0, 0, 0, .15);
    }

    .wc svg {
      width: 11px;
      height: 11px;
    }

    .wc:hover {
      filter: brightness(1.15);
    }

    .wc:active {
      filter: brightness(.85);
    }

    .wc-close {
      background: radial-gradient(circle at 90% 90%, #cc4600 0%, #dc6527 55%, #cd7546 70%, #ffccb2 90%, #fff 100%);
    }

    .win:not(.active) .wc {
      opacity: .75;
    }

    .win-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--xp-beige);
    }

    /* resize handles */

    .rz {
      position: absolute;
      z-index: 3;
      touch-action: none;
    }

    .rz-n,
    .rz-s {
      left: 12px;
      right: 12px;
      height: 8px;
      cursor: ns-resize;
    }

    .rz-n {
      top: -4px;
    }

    .rz-s {
      bottom: -4px;
    }

    .rz-e,
    .rz-w {
      top: 12px;
      bottom: 12px;
      width: 8px;
      cursor: ew-resize;
    }

    .rz-e {
      right: -4px;
    }

    .rz-w {
      left: -4px;
    }

    .rz-ne,
    .rz-nw,
    .rz-se,
    .rz-sw {
      width: 16px;
      height: 16px;
    }

    .rz-ne {
      top: -4px;
      right: -4px;
      cursor: nesw-resize;
    }

    .rz-sw {
      bottom: -4px;
      left: -4px;
      cursor: nesw-resize;
    }

    .rz-nw {
      top: -4px;
      left: -4px;
      cursor: nwse-resize;
    }

    .rz-se {
      bottom: -4px;
      right: -4px;
      cursor: nwse-resize;
    }

    .win.max .rz {
      display: none;
    }

    body.dragging,
    body.dragging * {
      user-select: none !important;
    }

    /* ---------- explorer ---------- */

    .explorer .win-body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .x-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 38px;
      padding: 0 6px;
      flex-shrink: 0;
      border-bottom: 1px solid #d5d2c2;
      box-shadow: 0 1px #fff;
      font-size: 12.5px;
    }

    .x-tb {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 7px 0 4px;
      white-space: nowrap;
    }

    .x-tb.off {
      filter: grayscale(1);
      opacity: .55;
    }

    .x-tb .ti {
      width: 24px;
      height: 24px;
    }

    .x-tb-sep {
      width: 1px;
      height: 26px;
      margin: 0 3px;
      background: #c5c2b2;
      box-shadow: 1px 0 #fff;
    }

    .x-search {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      width: 200px;
      padding: 0 4px 0 6px;
      background: #fff;
      border: 1px solid #7f9db9;
    }

    .x-search svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .x-search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 12.5px;
    }

    .x-address {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 6px;
      flex-shrink: 0;
      border-bottom: 1px solid #d5d2c2;
      box-shadow: 0 1px #fff;
      font-size: 12.5px;
    }

    .x-address>span:first-child {
      color: #6d6d6d;
    }

    .x-field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 5px;
      background: #fff;
      border: 1px solid #7f9db9;
      white-space: nowrap;
      overflow: hidden;
    }

    .x-field .fi {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .x-go {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 4px;
    }

    .x-go .gi {
      width: 20px;
      height: 20px;
    }

    .x-main {
      flex: 1;
      min-height: 0;
      display: flex;
      background: #fff;
    }

    .x-tasks {
      width: 210px;
      flex-shrink: 0;
      overflow: auto;
      padding: 12px 10px;
      background: linear-gradient(#7ba2e7, #6375d6);
    }

    .tp {
      margin-bottom: 14px;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 50, .2);
    }

    .tp-h {
      display: flex;
      align-items: center;
      height: 25px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 700;
      color: var(--xp-link);
      background: linear-gradient(90deg, #fff 30%, #c6d3f7);
    }

    .tp.special .tp-h {
      color: #fff;
      background: linear-gradient(90deg, #0c32a4 0%, #2a6ae0 100%);
    }

    .tp-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 9px 10px;
      background: #d6dff7;
      border: 1px solid #fff;
      border-top: none;
    }

    .tp.special .tp-list {
      background: #eff3ff;
    }

    .tp-link {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 0;
      font-size: 12px;
      color: var(--xp-link);
      text-align: left;
      text-decoration: none;
    }

    .tp-link:hover {
      color: var(--xp-link-hover);
      text-decoration: underline;
    }

    .tp-link .mi {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tp-link .mi img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      display: block;
    }

    .tp-detail {
      font-size: 12px;
      line-height: 1.5;
      color: #000;
    }

    .tp-detail b {
      display: block;
    }

    .x-content {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 18px 20px 24px;
      container-type: inline-size;
    }

    .x-intro {
      margin-bottom: 14px;
    }

    .x-intro h3 {
      font-family: var(--title);
      font-size: 20px;
      color: #0c327d;
    }

    .x-intro p {
      margin-top: 3px;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .x-sec+.x-sec {
      margin-top: 28px;
    }

    .x-sec-h {
      margin-bottom: 12px;
      padding-bottom: 5px;
      background: linear-gradient(90deg, #7ba2e7, rgba(123, 162, 231, 0)) left bottom / 100% 1px no-repeat;
    }

    .x-sec-h h4 {
      font-size: 13px;
      font-weight: 700;
      color: #0c327d;
    }

    .x-sec-h p {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .x-status {
      display: flex;
      align-items: center;
      height: 24px;
      padding: 0 22px 0 8px;
      flex-shrink: 0;
      font-size: 12px;
      border-top: 1px solid #fff;
      box-shadow: 0 -1px #d5d2c2;
      position: relative;
    }

    .x-status::after {
      content: '';
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, transparent 0 45%, #fff 45% 52%, #a6a28f 52% 60%, transparent 60% 70%, #fff 70% 76%, #a6a28f 76% 84%, transparent 84%);
    }

    /* ---------- game cards ---------- */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-flow: row dense;
      gap: 16px;
    }

    .card.wide {
      grid-column: span 2;
    }

    /* The PC section only has wide cards, so it gets a two-column grid of its own. */
    .cards.pc {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cards.pc .card.wide {
      grid-column: auto;
    }

    @container (max-width: 640px) {
      .cards.pc {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @container (min-width: 1180px) {
      .cards {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @container (max-width: 640px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card.wide {
        grid-column: 1 / -1;
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #a7b8dc;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(20, 50, 120, .15);
      outline: none;
      scroll-margin-top: 12px;
      transition: box-shadow .2s, border-color .2s;
    }

    .card:hover {
      border-color: #6f8fd8;
      box-shadow: 0 4px 14px rgba(20, 50, 120, .25);
    }

    .card.flash {
      animation: flash 1.4s ease-out;
    }

    @keyframes flash {

      0%,
      40% {
        border-color: var(--xp-select);
        box-shadow: 0 0 0 3px var(--xp-select);
      }
    }

    .card-shot {
      position: relative;
      display: block;
      overflow: hidden;
      background: #3a7bd5 url(wallpaper.jpg) center 35% / cover no-repeat;
      border-bottom: 1px solid #c8d3ea;
    }

    .card.phone .card-shot {
      flex: 1;
      min-height: 360px;
    }

    .card.wide .card-shot {
      aspect-ratio: 16 / 9;
    }

    .card.phone .card-shot img {
      position: absolute;
      top: 18px;
      left: 50%;
      height: calc(100% - 36px);
      width: auto;
      transform: translateX(-50%);
      border: 5px solid #151515;
      border-radius: 18px;
      background: #151515;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
      transition: transform .25s ease;
    }

    .card.wide .card-shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .card.phone:hover .card-shot img {
      transform: translateX(-50%) translateY(-4px);
    }

    .card.wide:hover .card-shot img {
      transform: scale(1.03);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      padding: 13px 15px 15px;
    }

    .card.wide .card-body {
      flex: 1;
    }

    .card-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--title);
      font-size: 18px;
      font-weight: 700;
      color: #0c327d;
    }

    .tag-clone {
      display: inline-flex;
      align-items: center;
      height: 19px;
      padding: 0 7px;
      border-radius: 3px;
      font: 700 10.5px var(--ui);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #5a3300;
      border: 1px solid #c77a1a;
      background: linear-gradient(#ffe2b8, #f9b257 55%, #f29d32);
      box-shadow: inset 0 1px rgba(255, 255, 255, .6);
    }

    .card-type {
      font-size: 12px;
      color: #6b7a99;
      margin-top: 1px;
    }

    .card-line {
      font-size: 13.5px;
      line-height: 1.5;
      color: #333;
      margin-top: 8px;
    }

    .card-foot {
      margin-top: auto;
      padding-top: 12px;
    }

    .card-soon {
      display: inline-block;
      font-size: 12.5px;
      color: #6b7a99;
      font-style: italic;
    }

    .xp-go-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, .45);
      border: 1px solid #2b6d17;
      background: linear-gradient(#64c94a 0%, #3ea12a 45%, #2f8a1f 55%, #3d9e2b 100%);
      box-shadow: inset 0 1px rgba(255, 255, 255, .5);
    }

    .xp-go-btn:hover {
      filter: brightness(1.1);
    }

    .xp-go-btn:active {
      filter: brightness(.9);
    }

    .no-match {
      padding: 24px 0;
      color: var(--ink-soft);
    }

    /* Phone-width folder: keep two phone cards per row, like an app store grid. */
    @container (max-width: 420px) {
      .cards {
        gap: 10px;
      }

      .card.phone .card-shot {
        min-height: 290px;
      }

      .card.phone .card-shot img {
        top: 12px;
        height: calc(100% - 24px);
        border-width: 4px;
        border-radius: 14px;
      }

      .card-body {
        padding: 10px 10px 12px;
      }

      .card-title {
        font-size: 15.5px;
        gap: 5px;
      }

      .tag-clone {
        height: 17px;
        padding: 0 5px;
        font-size: 9.5px;
      }

      .card-line {
        font-size: 12.5px;
        line-height: 1.45;
        margin-top: 6px;
      }

      .card-foot {
        padding-top: 10px;
      }

      .xp-go-btn {
        width: 100%;
        justify-content: center;
        min-height: 36px;
        padding: 4px 8px;
        font-size: 12px;
        text-align: center;
      }
    }

    /* ---------- about / contact / bin ---------- */

    .panel {
      padding: 16px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel-head .big {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .panel-head h3 {
      font-family: var(--title);
      font-size: 19px;
      color: #0c327d;
    }

    .panel-head p {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-top: 2px;
    }

    .group {
      position: relative;
      border: 1px solid #d0d0bf;
      border-radius: 4px;
      padding: 14px 12px 8px;
      margin-top: 10px;
      background: rgba(255, 255, 255, .45);
    }

    .group+.group {
      margin-top: 18px;
    }

    .group-h {
      position: absolute;
      top: -9px;
      left: 9px;
      padding: 0 4px;
      font-size: 12px;
      color: #0046d5;
      background: var(--xp-beige);
    }

    .prop {
      display: flex;
      gap: 14px;
      align-items: baseline;
      padding: 6px 0;
      font-size: 13.5px;
      text-decoration: none;
    }

    .prop-k {
      width: 86px;
      flex-shrink: 0;
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .prop-v {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    a.prop .prop-v {
      color: var(--xp-link);
    }

    a.prop:hover .prop-v {
      color: var(--xp-link-hover);
      text-decoration: underline;
    }

    .credit {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .credit a {
      color: var(--xp-link);
    }

    .empty {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      color: var(--ink-soft);
      text-align: center;
      background: #fff;
    }

    .empty .big {
      width: 48px;
      height: 48px;
      opacity: .8;
    }

    /* ---------- minesweeper ---------- */

    .mineswin .win-body {
      overflow: auto;
    }

    .ms {
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .ms-menu {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      padding: 0 2px;
      font-size: 12.5px;
    }

    .ms-mwrap {
      position: relative;
    }

    .ms-mbtn {
      height: 20px;
      padding: 0 8px;
    }

    .ms-mbtn:hover,
    .ms-mbtn[aria-expanded="true"] {
      background: var(--xp-select);
      color: #fff;
    }

    .ms-dd {
      position: absolute;
      top: 21px;
      left: 0;
      z-index: 5;
      min-width: 170px;
      padding: 2px;
      background: #fff;
      border: 1px solid #aca899;
      box-shadow: 2px 2px 4px rgba(0, 0, 0, .35);
    }

    .ms-dd button {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 4px 18px 4px 22px;
      text-align: left;
      position: relative;
    }

    .ms-dd button.on::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: currentColor;
    }

    .ms-dd button:hover {
      background: var(--xp-select);
      color: #fff;
    }

    .ms-dd hr {
      border: none;
      border-top: 1px solid #aca899;
      margin: 3px 1px;
    }

    .ms-flagbtn {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      border: 1px solid #aca899;
      border-radius: 3px;
      background: #fff;
    }

    .ms-flagbtn svg {
      width: 14px;
      height: 14px;
    }

    .ms-flagbtn[aria-pressed="true"] {
      background: #ffe2b8;
      border-color: #c77a1a;
    }

    @media (pointer: coarse) {
      .ms-flagbtn {
        display: inline-flex;
      }
    }

    .ms-frame {
      max-width: 100%;
      padding: 6px;
      background: #c0c0c0;
      border: 3px solid;
      border-color: #fff #808080 #808080 #fff;
    }

    .ms-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 5px;
      margin-bottom: 6px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
    }

    .ms-led {
      min-width: 54px;
      padding: 1px 3px;
      background: #000;
      color: #f00;
      font: 700 26px/1 'Courier New', monospace;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(255, 0, 0, .55);
      border: 1px solid;
      border-color: #808080 #fff #fff #808080;
    }

    .ms-face {
      width: 34px;
      height: 34px;
      padding: 3px;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
    }

    .ms-face:active {
      border-color: #808080 #fff #fff #808080;
    }

    .ms-face svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ms-wrap {
      max-width: 100%;
      overflow: auto;
      border: 3px solid;
      border-color: #808080 #fff #fff #808080;
      touch-action: pan-x pan-y;
    }

    .ms-board {
      --cell: 24px;
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--cell));
      width: max-content;
    }

    .mc {
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #c0c0c0;
      border: 3px solid;
      border-color: #fff #808080 #808080 #fff;
      font: 700 15px/1 Tahoma, Verdana, sans-serif;
    }

    .mc.open {
      border: none;
      border-left: 1px solid #808080;
      border-top: 1px solid #808080;
      cursor: default;
    }

    .mc.boom {
      background: #f00;
    }

    .mc svg {
      width: 64%;
      height: 64%;
      display: block;
    }

    .n1 {
      color: #0000ff;
    }

    .n2 {
      color: #008000;
    }

    .n3 {
      color: #f00;
    }

    .n4 {
      color: #000080;
    }

    .n5 {
      color: #800000;
    }

    .n6 {
      color: #008080;
    }

    .n7 {
      color: #000;
    }

    .n8 {
      color: #808080;
    }

    /* ---------- taskbar ---------- */

    .taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      display: flex;
      align-items: stretch;
      z-index: 100000;
      background: linear-gradient(#1f2f86 0, #3165c4 3%, #3682e5 6%, #4490e6 10%, #3883e5 12%, #2b71e0 15%, #2663da 18%, #235bd6 20%, #2258d5 23%, #2157d6 38%, #245ddb 54%, #2562df 86%, #245fdc 89%, #2158d4 92%, #1d4ec0 95%, #1941a5 98%);
    }

    .start-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 22px 0 9px;
      flex-shrink: 0;
      border-radius: 0 12px 12px 0;
      color: #fff;
      font-family: var(--title);
      font-size: 19px;
      font-weight: 700;
      font-style: italic;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .55);
      background: linear-gradient(#3c9f3c 0%, #5cc25c 8%, #43a743 18%, #2f8f2f 60%, #2d832d 85%, #2a6f2a 100%);
      box-shadow: inset -2px -2px 4px rgba(0, 0, 0, .3), inset 2px 2px 3px rgba(255, 255, 255, .35), 2px 0 4px rgba(0, 0, 0, .35);
    }

    .start-btn .sg {
      width: 22px;
      height: 22px;
      filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, .45));
    }

    .start-btn:hover {
      filter: brightness(1.1);
    }

    .start-btn[aria-expanded="true"] {
      background: linear-gradient(#2a7a2a, #2f8f2f 40%, #3ba43b);
    }

    .quick {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px 0 10px;
      margin-right: 4px;
      border-right: 1px solid rgba(0, 0, 0, .3);
      box-shadow: 1px 0 rgba(255, 255, 255, .15);
    }

    .ql {
      width: 26px;
      height: 26px;
      padding: 3px;
      border-radius: 3px;
    }

    .ql:hover {
      background: rgba(255, 255, 255, .2);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3);
    }

    .tasks {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 3px;
      padding-left: 4px;
      overflow: hidden;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 6px;
      height: calc(var(--taskbar-h) - 8px);
      width: 160px;
      min-width: 40px;
      flex-shrink: 1;
      padding: 0 9px;
      border-radius: 3px;
      color: #fff;
      font-size: 12px;
      text-align: left;
      background: linear-gradient(#3c81f3, #3a7ef1 50%, #2f6fe8);
      box-shadow: inset 1px 1px rgba(255, 255, 255, .35), inset -1px -1px rgba(0, 0, 0, .3), 1px 1px 1px rgba(0, 0, 0, .2);
    }

    .task:hover {
      filter: brightness(1.12);
    }

    .task.on {
      background: linear-gradient(#1e52b7, #1a4aa9);
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .5), inset -1px -1px rgba(255, 255, 255, .15);
    }

    .task .t-ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .task .t-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tray {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px 0 8px;
      color: #fff;
      flex-shrink: 0;
      border-left: 1px solid #1042af;
      background: linear-gradient(#0c59b9 0, #139ee9 6%, #18b5f2 10%, #139beb 14%, #1290e8 19%, #0d8dea 63%, #0d9ff1 81%, #0f9eed 88%, #119be9 91%, #1392e2 94%, #137ed7 97%, #095bc9 100%);
      box-shadow: inset 1px 0 1px #18bbff;
    }

    .tray-ico {
      width: 24px;
      height: 24px;
      padding: 3px;
      border-radius: 3px;
    }

    button.tray-ico:hover {
      background: rgba(255, 255, 255, .18);
    }

    .lang-ind {
      min-width: 26px;
      height: 20px;
      margin: 0 3px;
      padding: 0 3px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(#3e7de3, #1747b5);
      border: 1px solid #0b3290;
      box-shadow: inset 1px 1px rgba(255, 255, 255, .35);
    }

    .lang-ind:hover {
      filter: brightness(1.15);
    }

    .clock {
      font-size: 12px;
      min-width: 50px;
      padding-left: 4px;
      text-align: center;
      white-space: nowrap;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, .3);
    }

    /* ---------- balloon, context menu ---------- */

    .balloon {
      position: absolute;
      bottom: calc(var(--taskbar-h) + 14px);
      width: 320px;
      max-width: calc(100vw - 16px);
      z-index: 100002;
      padding: 9px 12px 10px;
      background: #ffffe1;
      border: 1px solid #000;
      border-radius: 8px;
      box-shadow: 2px 3px 8px rgba(0, 0, 0, .35);
      font-size: 12.5px;
      line-height: 1.45;
      color: #000;
      animation: pop-in .25s ease-out;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -15px;
      right: var(--tail, 30px);
      width: 0;
      height: 0;
      border-left: 0 solid transparent;
      border-right: 16px solid transparent;
      border-top: 15px solid #ffffe1;
      filter: drop-shadow(1px 1px 0 #000) drop-shadow(-1px 0 0 #000);
    }

    .bl-h {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      padding-right: 18px;
      font-size: 13px;
    }

    .bl-i {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .bl-x {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      color: #555;
    }

    .bl-x:hover {
      background: #e8e8c8;
      color: #000;
    }

    .balloon ul {
      list-style: none;
    }

    .balloon li::before {
      content: '- ';
    }

    .bl-tip {
      margin-top: 6px;
      color: #6b6b4b;
      font-size: 11.5px;
    }

    .ctx {
      position: absolute;
      z-index: 100003;
      min-width: 190px;
      padding: 2px;
      background: #fff;
      border: 1px solid #aca899;
      box-shadow: 2px 2px 4px rgba(0, 0, 0, .35);
      font-size: 12.5px;
    }

    .ctx button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 22px 4px 6px;
      text-align: left;
    }

    .ctx button span:first-child {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ctx button:hover,
    .ctx button:focus-visible {
      background: var(--xp-select);
      color: #fff;
      outline: none;
    }

    .ctx hr {
      border: none;
      border-top: 1px solid #aca899;
      margin: 3px 1px;
    }

    /* ---------- start menu ---------- */

    .start-menu {
      position: absolute;
      left: 0;
      bottom: var(--taskbar-h);
      width: 410px;
      max-width: 100vw;
      max-height: calc(100% - var(--taskbar-h));
      z-index: 100001;
      display: flex;
      flex-direction: column;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      background: #1d5fd2;
      border: 1px solid #0c3fae;
      box-shadow: 3px 3px 12px rgba(0, 0, 0, .5);
    }

    .sm-top {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 62px;
      flex-shrink: 0;
      padding: 0 10px;
      color: #fff;
      font-family: var(--title);
      font-size: 15px;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .55);
      background: linear-gradient(#1868ce 0%, #0e60cb 12%, #0e60cb 20%, #1164cf 32%, #1667cf 33%, #1b6cd3 47%, #1e70d9 54%, #2476dc 60%, #297ae0 65%, #3482e3 77%, #3786e5 79%, #428ee9 90%, #4791eb 100%);
      border-bottom: 2px solid #e78a2f;
    }

    .sm-avatar {
      width: 46px;
      height: 46px;
      padding: 7px;
      border-radius: 4px;
      border: 2px solid #fff;
      background: linear-gradient(135deg, #6ec0ff, #1d6fd6);
      box-shadow: 1px 1px 3px rgba(0, 0, 0, .4);
    }

    .sm-cols {
      display: flex;
      min-height: 0;
      overflow: auto;
      background: #fff;
    }

    .sm-left {
      flex: 1;
      min-width: 0;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .sm-right {
      width: 160px;
      flex-shrink: 0;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: #d3e5fa;
      border-left: 1px solid #95bdee;
    }

    .sm-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 5px 6px;
      text-align: left;
      text-decoration: none;
      color: #000;
      font-size: 12.5px;
    }

    .sm-item:hover,
    .sm-item:focus-visible {
      background: var(--xp-select);
      color: #fff;
      outline: none;
    }

    .sm-item:hover small,
    .sm-item:focus-visible small {
      color: #dfe9ff;
    }

    .sm-item .s-ico {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .sm-right .sm-item .s-ico {
      width: 24px;
      height: 24px;
    }

    .sm-right .sm-item {
      font-weight: 700;
      color: #0a246a;
    }

    .sm-item .s-ico img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .sm-item b {
      display: block;
      font-weight: 700;
    }

    .sm-item small {
      display: block;
      font-size: 11.5px;
      color: #6b7a99;
    }

    .sm-sep {
      height: 1px;
      margin: 4px 6px;
      background: linear-gradient(90deg, transparent, #b8c6e0, transparent);
    }

    .sm-all {
      font-weight: 700;
    }

    .sm-all .arrow {
      width: 18px;
      height: 18px;
      margin-left: auto;
    }

    .sm-bottom {
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
      padding: 6px 8px;
      background: linear-gradient(#4282d6 0%, #3b85e0 3%, #418ae3 5%, #418ae3 17%, #3c87e2 21%, #3786e4 26%, #3482e3 29%, #2e7ee1 39%, #2374df 49%, #2072db 57%, #196edb 62%, #176bd8 72%, #1468d5 75%, #1165d4 83%, #0f61cb 88%);
    }

    .sm-off {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 3px;
      color: #fff;
      font-size: 12.5px;
    }

    .sm-off:hover {
      background: rgba(255, 255, 255, .15);
    }

    .sm-off .pw {
      width: 22px;
      height: 22px;
      padding: 3px;
      border-radius: 4px;
      border: 1px solid #fff;
      background: linear-gradient(#f5a27a, #e0552a 45%, #c63c13 55%, #e26a3c);
    }

    /* ---------- responsive ---------- */

    /* Phones in portrait, and short landscape phones: full-screen windows, bigger touch targets. */
    @media (max-width: 700px), (max-height: 500px) {
      :root {
        --taskbar-h: calc(44px + env(safe-area-inset-bottom, 0px));
      }

      .taskbar {
        padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      #windows {
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
      }

      .desktop-icons {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        justify-items: center;
        gap: 14px 4px;
        right: 8px;
        bottom: auto;
      }

      .d-icon {
        width: 76px;
      }

      .win {
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border-radius: 0;
      }

      .win-bar {
        height: 40px;
        border-radius: 0;
      }

      .wc {
        width: 32px;
        height: 32px;
      }

      .wc-max,
      .rz,
      .quick {
        display: none !important;
      }

      .x-tasks,
      .x-tb,
      .x-tb-sep,
      .x-address,
      .x-status {
        display: none;
      }

      .x-toolbar {
        height: 46px;
      }

      .x-search {
        width: 100%;
        height: 34px;
        margin-left: 0;
      }

      /* 16px stops iOS Safari from zooming in when the field is focused. */
      .x-search input {
        font-size: 16px;
      }

      .x-content {
        padding: 14px;
      }

      .start-btn {
        padding: 0 14px 0 8px;
        font-size: 17px;
      }

      .task {
        width: 42px;
        justify-content: center;
      }

      .task .t-label {
        display: none;
      }

      .tray {
        padding: 0 6px;
        gap: 2px;
      }

      .tray-ico {
        width: 30px;
        height: 30px;
        padding: 5px;
      }

      .sm-right {
        width: 136px;
      }

      .ms-board {
        --cell: 32px;
      }

      .ms {
        margin: 0;
        width: 100%;
        align-items: center;
      }

      .ms-menu {
        align-self: stretch;
      }
    }

    @media (max-width: 380px) {
      .tray-vol {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .screen.booting,
      .win.opening,
      .card.flash,
      .balloon,
      .boot-bar span {
        animation: none;
      }

      .boot-bar span {
        left: 60px;
      }

      .card-shot img {
        transition: none !important;
      }
    }
  </style>
</head>

    function filterGames(q) {
      searchQ = q;
      const win = wins.get('games');
      if (!win) return;
      const needle = q.trim().toLocaleLowerCase(lang);
      let shown = 0;
      win.el.querySelectorAll('.card').forEach(card => {
        const g = games.find(x => x.id === card.dataset.game);
        const hay = [g.title, g.type[lang], g.platform, g.clone ? 'clone klon' : ''].join(' ').toLocaleLowerCase(lang);
        const match = !needle || hay.includes(needle);
        card.hidden = !match;
        if (match) shown++;
      });
      win.el.querySelectorAll('.x-sec').forEach(sec => {
        sec.hidden = !sec.querySelector('.card:not([hidden])');
      });
      win.el.querySelector('.no-match').hidden = shown > 0;
      win.el.querySelector('.x-status').textContent = t('items')(shown);
    }

    function showGame(id) {
      openWin('games');
      const win = wins.get('games');
      const card = win.el.querySelector('#card-' + id);
      if (!card) return;
      if (card.hidden) {
        win.el.querySelector('.x-search input').value = '';
        filterGames('');
      }
      card.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
      card.focus({ preventScroll: true });
      setHash('#' + id);
    }

        </div>`;
    }

    function renderRecycle() {
      return `<div class="empty"><span class="big">${ICONS.bin}</span><p>${t('binEmpty')}</p></div>`;
    }

    /* ---------- minesweeper ---------- */

    const MS_LEVELS = { beginner: [9, 9, 10], intermediate: [16, 16, 40], expert: [30, 16, 99] };
    const ms = { level: 'beginner', cols: 9, rows: 9, mines: 10, cells: [], state: 'ready', flags: 0, opened: 0, time: 0, timer: null, flagMode: false, face: 'smile' };

    function msNew(level = ms.level) {
      const [cols, rows, mines] = MS_LEVELS[level];
      clearInterval(ms.timer);
      Object.assign(ms, { level, cols, rows, mines, state: 'ready', flags: 0, opened: 0, time: 0, timer: null, face: 'smile' });
      ms.cells = Array.from({ length: cols * rows }, () => ({ mine: false, n: 0, open: false, flag: false, boom: false, wrong: false, show: false }));
      const win = wins.get('mines');
      if (win) {
        fillWin(win);
        msFit();
      }
    }

    function msNeighbors(i) {
      const x = i % ms.cols, y = (i / ms.cols) | 0, out = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if ((dx || dy) && nx >= 0 && ny >= 0 && nx < ms.cols && ny < ms.rows) out.push(ny * ms.cols + nx);
        }
      }
      return out;
    }

    // Mines are placed after the first click so the opening move never loses.
    function msPlant(safe) {
      const banned = new Set([safe, ...msNeighbors(safe)]);
      let placed = 0;
      while (placed < ms.mines) {
        const i = (Math.random() * ms.cells.length) | 0;
        if (banned.has(i) || ms.cells[i].mine) continue;
        ms.cells[i].mine = true;
        placed++;
      }
      ms.cells.forEach((c, i) => { c.n = msNeighbors(i).filter(j => ms.cells[j].mine).length; });
    }

    function msReveal(i) {
      const c = ms.cells[i];
      if (c.open || c.flag) return true;
      if (c.mine) {
        c.boom = true;
        return false;
      }
      const stack = [i];
      while (stack.length) {
        const k = stack.pop();
        const cell = ms.cells[k];
        if (cell.open || cell.flag) continue;
        cell.open = true;
        ms.opened++;
        if (cell.n === 0) msNeighbors(k).forEach(j => { if (!ms.cells[j].open) stack.push(j); });
      }
      return true;
    }

    function msClick(i) {
      if (ms.state === 'won' || ms.state === 'lost') return;
      const c = ms.cells[i];
      if (c.flag) return;
      if (ms.state === 'ready') {
        msPlant(i);
        ms.state = 'playing';
        ms.timer = setInterval(() => {
          ms.time = Math.min(999, ms.time + 1);
          msPaintHead();
        }, 1000);
      }
      let ok = true;
      if (c.open) {
        const around = msNeighbors(i);
        if (c.n && around.filter(j => ms.cells[j].flag).length === c.n) {
          around.forEach(j => { ok = msReveal(j) && ok; });
        }
      } else {
        ok = msReveal(i);
      }
      if (!ok) msEnd(false);
      else if (ms.opened === ms.cells.length - ms.mines) msEnd(true);
      msPaint();
    }

    function msFlag(i) {
      if (ms.state === 'won' || ms.state === 'lost') return;
      const c = ms.cells[i];
      if (c.open) return;
      c.flag = !c.flag;
      ms.flags += c.flag ? 1 : -1;
      msPaint();
    }

    function msEnd(won) {
      clearInterval(ms.timer);
      ms.state = won ? 'won' : 'lost';
      ms.face = won ? 'cool' : 'dead';
      ms.cells.forEach(c => {
        if (won && c.mine) c.flag = true;
        if (!won && c.mine && !c.flag) c.show = true;
        if (!won && !c.mine && c.flag) c.wrong = true;
      });
      if (won) ms.flags = ms.mines;
    }

    function msCell(c) {
      if (c.open) return { cls: 'mc open', html: c.n ? `<span class="n${c.n}">${c.n}</span>` : '', label: c.n ? String(c.n) : t('msEmpty') };
      if (c.boom) return { cls: 'mc open boom', html: ICONS.msMine, label: t('msMineCell') };
      if (c.wrong) return { cls: 'mc open', html: ICONS.msWrong, label: t('msFlagged') };
      if (c.show) return { cls: 'mc open', html: ICONS.msMine, label: t('msMineCell') };
      if (c.flag) return { cls: 'mc', html: ICONS.msFlag, label: t('msFlagged') };
      return { cls: 'mc', html: '', label: t('msHidden') };
    }

    const msLed = n => (n < 0 ? '-' + String(Math.min(99, -n)).padStart(2, '0') : String(Math.min(999, n)).padStart(3, '0'));

    function msFaceSvg(f) {
      const eyes = f === 'dead'
        ? '<path d="M7 8l3 3M10 8l-3 3M14 8l3 3M17 8l-3 3" stroke="#000" stroke-width="1.4"/>'
        : f === 'cool'
          ? '<path d="M4.5 8.5h15v1.2l-1.2 2.6h-4.1l-1.4-2.4h-1.6l-1.4 2.4H5.7L4.5 9.7z" fill="#000"/>'
          : '<circle cx="9" cy="9.5" r="1.4" fill="#000"/><circle cx="15" cy="9.5" r="1.4" fill="#000"/>';
      const mouth = f === 'o'
        ? '<circle cx="12" cy="16" r="2.3" fill="none" stroke="#000" stroke-width="1.4"/>'
        : f === 'dead'
          ? '<path d="M8 18q4-4 8 0" fill="none" stroke="#000" stroke-width="1.4"/>'
          : '<path d="M7.5 14.5q4.5 4.5 9 0" fill="none" stroke="#000" stroke-width="1.4"/>';
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ff0" stroke="#000" stroke-width="1.2"/>${eyes}${mouth}</svg>`;
    }

    function renderMines() {
      const cells = ms.cells.map((c, i) => {
        const { cls, html, label } = msCell(c);
        return `<button class="${cls}" data-i="${i}" aria-label="${label}">${html}</button>`;
      }).join('');
      const lvl = k => `<button class="${ms.level === k ? 'on' : ''}" onclick="msNew('${k}')">${t('ms' + k[0].toUpperCase() + k.slice(1))}</button>`;
      return `
        <div class="ms">
          <div class="ms-menu">
            <div class="ms-mwrap">
              <button class="ms-mbtn" aria-haspopup="true" aria-expanded="false" onclick="msMenu(this)">${t('msGame')}</button>
              <div class="ms-dd" hidden>
                <button onclick="msNew()"><span>${t('msNew')}</span><span>F2</span></button>
                <hr>
                ${lvl('beginner')}${lvl('intermediate')}${lvl('expert')}
              </div>
            </div>
            <button class="ms-flagbtn" aria-pressed="${ms.flagMode}" onclick="msToggleFlag(this)">${ICONS.msFlag}<span>${t('msFlagMode')}</span></button>
          </div>
          <div class="ms-frame">
            <div class="ms-head">
              <span class="ms-led" id="ms-count">${msLed(ms.mines - ms.flags)}</span>
              <button class="ms-face" id="ms-face" onclick="msNew()" aria-label="${t('msNew')}">${msFaceSvg(ms.face)}</button>
              <span class="ms-led" id="ms-time">${msLed(ms.time)}</span>
            </div>
            <div class="ms-wrap">
              <div class="ms-board" role="group" aria-label="${t('msBoard')}" style="--cols:${ms.cols}">${cells}</div>
            </div>
          </div>
        </div>`;
    }

    function msPaintHead() {
      const count = document.getElementById('ms-count');
      if (!count) return;
      count.textContent = msLed(ms.mines - ms.flags);
      document.getElementById('ms-time').textContent = msLed(ms.time);
      document.getElementById('ms-face').innerHTML = msFaceSvg(ms.face);
    }

    function msPaint() {
      const win = wins.get('mines');
      if (!win) return;
      win.el.querySelectorAll('.mc').forEach(b => {
        const c = ms.cells[+b.dataset.i];
        const key = [c.open, c.flag, c.boom, c.wrong, c.show, c.n].join();
        if (b.dataset.k === key) return;
        const { cls, html, label } = msCell(c);
        b.dataset.k = key;
        b.className = cls;
        b.innerHTML = html;
        b.setAttribute('aria-label', label);
      });
      msPaintHead();
    }

    function msSetFace(f) {
      if (ms.state === 'won' || ms.state === 'lost') return;
      ms.face = f;
      msPaintHead();
    }

    function msMenu(btn) {
      const dd = btn.nextElementSibling;
      dd.hidden = !dd.hidden;
      btn.setAttribute('aria-expanded', !dd.hidden);
    }

    function msToggleFlag(btn) {
      ms.flagMode = !ms.flagMode;
      btn.setAttribute('aria-pressed', ms.flagMode);
    }

    function msBind(win) {
      const board = win.el.querySelector('.ms-board');
      let lp = null, lpFired = false, sx = 0, sy = 0;
      const cancel = () => {
        clearTimeout(lp);
        if (ms.face === 'o') msSetFace('smile');
      };
      board.addEventListener('contextmenu', e => {
        e.preventDefault();
        const b = e.target.closest('.mc');
        if (b && lastPointer === 'mouse') msFlag(+b.dataset.i);
      });
      board.addEventListener('pointerdown', e => {
        const b = e.target.closest('.mc');
        if (!b) return;
        if (e.pointerType === 'mouse') {
          if (e.button === 0) msSetFace('o');
          return;
        }
        lpFired = false;
        sx = e.clientX;
        sy = e.clientY;
        lp = setTimeout(() => {
          lpFired = true;
          msFlag(+b.dataset.i);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 420);
      });
      board.addEventListener('pointermove', e => {
        if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 10) clearTimeout(lp);
      });
      board.addEventListener('pointerup', cancel);
      board.addEventListener('pointerleave', cancel);
      board.addEventListener('pointercancel', cancel);
      board.addEventListener('click', e => {
        const b = e.target.closest('.mc');
        if (!b) return;
        if (lpFired) {
          lpFired = false;
          return;
        }
        const i = +b.dataset.i;
        if (ms.flagMode && !ms.cells[i].open) msFlag(i);
        else msClick(i);
      });
    }

    // Size the window to the board, like the real thing.
    function msFit() {
      const win = wins.get('mines');
      if (!win || isMobile() || win.el.classList.contains('max')) return;
      const el = win.el;
      el.style.width = 'auto';
      el.style.height = 'auto';
      const maxBottom = innerHeight - taskbarH();
      const w = Math.min(el.offsetWidth, innerWidth - 12);
      const h = Math.min(el.offsetHeight, maxBottom - 12);
      Object.assign(el.style, {
        width: w + 'px',
        height: h + 'px',
        left: Math.max(6, Math.min(el.offsetLeft, innerWidth - w - 6)) + 'px',
        top: Math.max(6, Math.min(el.offsetTop, maxBottom - h - 6)) + 'px'
      });
    }

    /* ---------- window manager ---------- */

    const apps = {
      games: { icon: 'folder', title: () => t('winGames'), w: 1080, h: 740, render: renderExplorer, cls: 'explorer', mounted: () => filterGames(searchQ) },
      about: { icon: 'computer', title: () => t('winAbout'), w: 520, h: 520, render: renderAbout },
      contact: { icon: 'mail', title: () => t('winContact'), w: 540, h: 420, render: renderContact },
      recycle: { icon: 'bin', title: () => t('winRecycle'), w: 440, h: 300, render: renderRecycle },
      mines: { icon: 'mine', title: () => t('winMines'), w: 300, h: 380, render: renderMines, cls: 'mineswin', mounted: msBind, opened: msFit, closed: () => msNew() }
    };

    const MIN_W = 300;
    const MIN_H = 200;
    const wins = new Map();
    let zTop = 10;
    let cascade = 0;

    function placeWin(el, id, def) {
      const vw = innerWidth;
      const vh = innerHeight - taskbarH();
      const w = Math.min(def.w, vw - 24);
      const h = Math.min(def.h, vh - 24);
      let x, y;
      if (id === 'games') {
        x = Math.max(12, Math.min(110, vw - w - 12));
        y = Math.max(12, Math.min(24, vh - h - 12));
      } else {
        const off = (cascade++ % 6) * 28;
        x = Math.max(12, Math.min((vw - w) / 2 + 80 + off, vw - w - 12));
        y = Math.max(12, Math.min((vh - h) / 2 - 20 + off, vh - h - 12));
      }
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    }

    function setHash(url) {
      try { history.replaceState(null, '', url); } catch (err) { }
    }

    function openWin(id) {
      closeMenus();
      let win = wins.get(id);
      if (!win) {
        const def = apps[id];
        if (!def) return;
        const el = document.createElement('section');
        el.className = 'win ' + (def.cls || '');
        el.setAttribute('role', 'dialog');
        el.setAttribute('aria-labelledby', 'wt-' + id);
        el.tabIndex = -1;
        el.innerHTML = `
          <header class="win-bar">
            <span class="win-ico">${ICONS[def.icon]}</span>
            <h2 class="win-title" id="wt-${id}"></h2>
            <div class="win-ctrls">
              <button class="wc wc-min" data-act="min">${ICONS.wMin}</button>
              <button class="wc wc-max" data-act="max">${ICONS.wMax}</button>
              <button class="wc wc-close" data-act="close">${ICONS.wClose}</button>
            </div>
          </header>
          <div class="win-body"></div>
          ${['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(d => `<div class="rz rz-${d}" data-dir="${d}" aria-hidden="true"></div>`).join('')}`;
        placeWin(el, id, def);
        document.getElementById('windows').appendChild(el);
        win = { id, el, def, min: false };
        wins.set(id, win);
        fillWin(win);
        bindWin(win);
        if (def.opened) def.opened(win);
        if (!reduceMotion) {
          el.classList.add('opening');
          el.addEventListener('animationend', () => el.classList.remove('opening'), { once: true });
        }
      }
      win.min = false;
      win.el.hidden = false;
      focusWin(id);
      win.el.focus({ preventScroll: true });
    }

    function fillWin(win) {
      win.el.querySelector('.win-title').textContent = win.def.title();
      win.el.querySelector('.win-body').innerHTML = win.def.render();
      win.el.querySelector('.wc-min').setAttribute('aria-label', t('minimize'));
      win.el.querySelector('.wc-max').setAttribute('aria-label', t('maximize'));
      win.el.querySelector('.wc-close').setAttribute('aria-label', t('close'));
      if (win.def.mounted) win.def.mounted(win);
    }

    // Shared pointer-drag helper for moving and resizing windows and the desktop marquee.
    function drag(e, target, onMove, onEnd) {
      e.preventDefault();
      try { target.setPointerCapture(e.pointerId); } catch (err) { }
      document.body.classList.add('dragging');
      const sx = e.clientX, sy = e.clientY;
      const move = ev => onMove(ev.clientX - sx, ev.clientY - sy);
      const up = () => {
        document.body.classList.remove('dragging');
        target.removeEventListener('pointermove', move);
        target.removeEventListener('pointerup', up);
        target.removeEventListener('pointercancel', up);
        if (onEnd) onEnd();
      };
      target.addEventListener('pointermove', move);
      target.addEventListener('pointerup', up);
      target.addEventListener('pointercancel', up);
    }

    function bindWin(win) {
      const { el, id } = win;
      const bar = el.querySelector('.win-bar');
      el.addEventListener('pointerdown', () => focusWin(id));
      el.querySelector('.win-ctrls').addEventListener('click', e => {
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'min') minWin(id);
        if (act === 'max') el.classList.toggle('max');
        if (act === 'close') closeWin(id);
      });
      bar.addEventListener('dblclick', e => {
        if (!e.target.closest('button') && !isMobile()) el.classList.toggle('max');
      });
      bar.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('button') || isMobile() || el.classList.contains('max')) return;
        const ox = el.offsetLeft, oy = el.offsetTop;
        drag(e, bar, (dx, dy) => {
          el.style.left = Math.max(100 - el.offsetWidth, Math.min(ox + dx, innerWidth - 100)) + 'px';
          el.style.top = Math.max(0, Math.min(oy + dy, innerHeight - taskbarH() - 30)) + 'px';
        });
      });
      el.querySelectorAll('.rz').forEach(handle => handle.addEventListener('pointerdown', e => {
        if (e.button !== 0 || isMobile() || el.classList.contains('max')) return;
        const dir = handle.dataset.dir;
        const r = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
        const maxBottom = innerHeight - taskbarH();
        drag(e, handle, (dx, dy) => {
          let { x, y, w, h } = r;
          if (dir.includes('e')) w = Math.max(MIN_W, Math.min(r.w + dx, innerWidth - r.x));
          if (dir.includes('s')) h = Math.max(MIN_H, Math.min(r.h + dy, maxBottom - r.y));
          if (dir.includes('w')) {
            x = Math.max(0, Math.min(r.x + dx, r.x + r.w - MIN_W));
            w = r.w + r.x - x;
          }
          if (dir.includes('n')) {
            y = Math.max(0, Math.min(r.y + dy, r.y + r.h - MIN_H));
            h = r.h + r.y - y;
          }
          Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        });
      }));
    }

    function topWin() {
      let best = null;
      wins.forEach(w => {
        if (!w.min && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w;
      });
      return best;
    }

    function focusWin(id) {
      const win = wins.get(id);
      if (!win) return;
      if (+win.el.style.zIndex !== zTop) win.el.style.zIndex = ++zTop;
      wins.forEach(w => w.el.classList.toggle('active', w === win));
      renderTasks();
    }

    function refocus() {
      const next = topWin();
      wins.forEach(w => w.el.classList.toggle('active', w === next));
      if (next) next.el.focus({ preventScroll: true });
      renderTasks();
    }

    function minWin(id) {
      const win = wins.get(id);
      win.min = true;
      win.el.hidden = true;
      refocus();
    }

    function closeWin(id) {
      const win = wins.get(id);
      if (!win) return;
      win.el.remove();
      wins.delete(id);
      if (win.def.closed) win.def.closed();
      if (id === 'games' && location.hash) setHash(location.pathname + location.search);
      refocus();
    }

    function showDesktop() {
      wins.forEach(w => {
        w.min = true;
        w.el.hidden = true;
      });
      refocus();
    }

    function renderTasks() {
      const active = topWin();
      const box = document.getElementById('tasks');
      box.innerHTML = '';
      wins.forEach(w => {
        const b = document.createElement('button');
        const on = w === active;
        b.className = 'task' + (on ? ' on' : '');
        b.setAttribute('aria-pressed', on);
        b.title = w.def.title();
        b.innerHTML = `<span class="t-ico">${ICONS[w.def.icon]}</span><span class="t-label">${w.def.title()}</span>`;
        b.onclick = () => (on ? minWin(w.id) : openWin(w.id));
        box.appendChild(b);
      });
    }

    addEventListener('resize', () => {
      if (isMobile()) return;
      const maxBottom = innerHeight - taskbarH();
      wins.forEach(({ el }) => {
        if (el.offsetWidth > innerWidth - 24) el.style.width = Math.max(MIN_W, innerWidth - 24) + 'px';
        if (el.offsetHeight > maxBottom - 24) el.style.height = Math.max(MIN_H, maxBottom - 24) + 'px';
        el.style.left = Math.max(0, Math.min(el.offsetLeft, innerWidth - el.offsetWidth)) + 'px';
        el.style.top = Math.max(0, Math.min(el.offsetTop, maxBottom - el.offsetHeight)) + 'px';
      });
    });

    /* ---------- desktop: icons, marquee, context menu ---------- */

    const desk = document.getElementById('desktop-icons');
    const clearSel = () => desk.querySelectorAll('.d-icon.sel').forEach(i => i.classList.remove('sel'));

    function launch(icon) {
      clearSel();
      if (icon.dataset.href) window.open(icon.dataset.href, '_blank', 'noopener');
      else openWin(icon.dataset.open);
    }

    // Mouse: click selects, double-click opens. Touch and keyboard open right away.
    desk.querySelectorAll('.d-icon').forEach(icon => {
      icon.addEventListener('click', e => {
        if (e.detail === 0 || lastPointer !== 'mouse') return launch(icon);
        clearSel();
        icon.classList.add('sel');
      });
      icon.addEventListener('dblclick', () => launch(icon));
    });

    const DESK_UI = '.d-icon, .win, .taskbar, .start-menu, .ctx, .balloon, .boot';

    screenEl.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest(DESK_UI)) return;
      clearSel();
      const sx = e.clientX, sy = e.clientY;
      const box = document.createElement('div');
      box.className = 'marquee';
      const icons = [...desk.querySelectorAll('.d-icon')];
      drag(e, screenEl, (dx, dy) => {
        if (!box.isConnected) screenEl.appendChild(box);
        const x = Math.min(sx, sx + dx), y = Math.min(sy, sy + dy), w = Math.abs(dx), h = Math.abs(dy);
        Object.assign(box.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        icons.forEach(icon => {
          const r = icon.getBoundingClientRect();
          icon.classList.toggle('sel', r.left < x + w && r.right > x && r.top < y + h && r.bottom > y);
        });
      }, () => box.remove());
    });

    const ctxEl = document.getElementById('ctx');

    screenEl.addEventListener('contextmenu', e => {
      if (e.target.closest(DESK_UI)) return;
      e.preventDefault();
      closeMenus();
      ctxEl.hidden = false;
      const x = Math.min(e.clientX, innerWidth - ctxEl.offsetWidth - 4);
      const y = Math.min(e.clientY, innerHeight - taskbarH() - ctxEl.offsetHeight - 4);
      Object.assign(ctxEl.style, { left: x + 'px', top: y + 'px' });
      ctxEl.querySelector('button').focus();
    });

    ctxEl.addEventListener('click', e => {
      if (e.target.closest('button')) ctxEl.hidden = true;
    });

    function ctxRefresh() {
      desk.style.visibility = 'hidden';
      setTimeout(() => { desk.style.visibility = ''; }, 120);
    }

    /* ---------- start menu, menus, keys ---------- */

    function renderStart() {
      const item = (onclick, ico, title, sub) => `
        <button class="sm-item" onclick="${onclick}">
          <span class="s-ico">${ico}</span>
          <span><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>
        </button>`;
      document.getElementById('sm-left').innerHTML =
        games.map(g => item(`showGame('${g.id}')`, `<img src="${g.thumb}" alt="">`, g.title, g.type[lang])).join('') +
        '<div class="sm-sep"></div>' +
        item("openWin('mines')", ICONS.mine, t('winMines')) +
        '<div class="sm-sep"></div>' +
        `<button class="sm-item sm-all" onclick="openWin('games')"><span>${t('allGames')}</span><span class="arrow">${ICONS.arrow}</span></button>`;
    }

    function toggleStart(force) {
      const menu = document.getElementById('start-menu');
      const btn = document.getElementById('start-btn');
      const open = force ?? menu.hidden;
      if (open) closeMenus();
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', open);
      if (open) menu.querySelector('button')?.focus();
    }

    function closeMenus(except) {
      const menu = document.getElementById('start-menu');
      if (!menu.hidden && except !== 'start') toggleStart(false);
      if (except !== 'ctx') ctxEl.hidden = true;
      document.querySelectorAll('.ms-dd:not([hidden])').forEach(dd => {
        if (except === 'ms') return;
        dd.hidden = true;
        dd.previousElementSibling.setAttribute('aria-expanded', 'false');
      });
    }

    document.addEventListener('pointerdown', e => {
      if (e.target.closest('#start-menu, #start-btn')) closeMenus('start');
      else if (e.target.closest('#ctx')) closeMenus('ctx');
      else if (e.target.closest('.ms-mwrap')) closeMenus('ms');
      else closeMenus();
    });

    document.addEventListener('keydown', e => {
      if (!bootEl.hidden) return;
      if (e.key === 'F2' && topWin()?.id === 'mines') {
        e.preventDefault();
        msNew();
        return;
      }
      if (e.key !== 'Escape') return;
      // Let text fields handle Escape themselves (the search box clears itself).
      if (e.target.closest?.('input, textarea')) return;
      const menu = document.getElementById('start-menu');
      if (!menu.hidden) {
        toggleStart(false);
        document.getElementById('start-btn').focus();
      } else if (!ctxEl.hidden || document.querySelector('.ms-dd:not([hidden])')) {
        closeMenus();
      } else {
        const top = topWin();
        if (top) closeWin(top.id);
      }
    });

    /* ---------- welcome balloon ---------- */

    const balloonEl = document.getElementById('balloon');
    let balloonTimer = null;

    function showBalloon() {
      balloonEl.hidden = false;
      const icon = document.getElementById('tray-info').getBoundingClientRect();
      const right = isMobile() ? 8 : Math.max(8, innerWidth - icon.right - 24);
      balloonEl.style.right = right + 'px';
      const tail = innerWidth - right - (icon.left + icon.width / 2) - 4;
      balloonEl.style.setProperty('--tail', Math.max(10, tail) + 'px');
      clearTimeout(balloonTimer);
      balloonTimer = setTimeout(hideBalloon, 14000);
    }

    function hideBalloon() {
      balloonEl.hidden = true;
      clearTimeout(balloonTimer);
    }

    /* ---------- power + boot ---------- */

    const powerEl = document.getElementById('power');
    const bootEl = document.getElementById('boot');

    function shutDown() {
      closeMenus();
      hideBalloon();
      const done = () => {
        screenEl.classList.remove('shutting');
        screenEl.hidden = true;
        powerEl.hidden = false;
        powerEl.querySelector('button').focus();
      };
      if (reduceMotion) return done();
      screenEl.classList.add('shutting');
      screenEl.addEventListener('animationend', done, { once: true });
    }

    function powerOn() {
      powerEl.hidden = true;
      screenEl.hidden = false;
      boot();
    }

    function boot() {
      bootEl.hidden = false;
      bootEl.classList.remove('fade');
      if (!reduceMotion) {
        screenEl.classList.add('booting');
        screenEl.addEventListener('animationend', () => screenEl.classList.remove('booting'), { once: true });
      }
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        removeEventListener('keydown', finish);
        bootEl.classList.add('fade');
        setTimeout(() => {
          bootEl.hidden = true;
          const top = topWin();
          if (top) top.el.focus({ preventScroll: true });
          setTimeout(showBalloon, 600);
        }, reduceMotion ? 0 : 400);
      };
      const timer = setTimeout(finish, reduceMotion ? 1200 : 2600);
      bootEl.onclick = finish;
      addEventListener('keydown', finish);
    }

    /* ---------- language, clock ---------- */

    function setLang(l) {
      lang = l;
      store.set('lang', l);
      applyLang();
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = `Alper Can Karakaş · ${t('bootSub')}`;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = i18n[lang][el.dataset.i18n];
        if (typeof v === 'string') el.textContent = v;
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
        el.setAttribute('aria-label', el.title);
      });
      document.getElementById('bl-2').textContent = t(isTouch() ? 'welcome2Touch' : 'welcome2');
      document.getElementById('bl-tip').textContent = t(isTouch() ? 'welcomeTipTouch' : 'welcomeTip');
      const ind = document.getElementById('lang-ind');
      ind.textContent = lang.toUpperCase();
      ind.title = lang === 'en' ? 'English · Türkçe için tıkla' : 'Türkçe · Click for English';
      ind.setAttribute('aria-label', ind.title);
      wins.forEach(fillWin);
      renderTasks();
      renderStart();
      tick();
    }

    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString(lang === 'tr' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit' });
    }

    document.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = ICONS[el.dataset.icon];
    });

    msNew('beginner');
    applyLang();
    setInterval(tick, 15000);

    openWin('games');
    const hashGame = games.find(g => '#' + g.id === location.hash);
    if (hashGame) showGame(hashGame.id);

    let booted = false;
    try { booted = sessionStorage.getItem('booted') === '1'; sessionStorage.setItem('booted', '1'); } catch (e) { }
    if (!booted) boot();
  </script>

</body>

</html>
